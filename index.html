<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>개발자 성향 테스트</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
  /* Layout: 하나의 좁은 세로 컬럼에서 소개 → 질문 → 결과 화면이 같은 자리에서 바뀝니다. 왼쪽 정렬, 진행 막대는 10칸. */
  :root {
    --bg: #edf0f7;
    --surface: #ffffff;
    --fg: #16203a;
    --muted: #5b6580;
    --line: #d5dae8;
    --accent: #3d5afe;
    --accent-ink: #ffffff;
    --fe: #f0506e;
    --be: #2563eb;
    --fs: #e8a400;
    --font-display: "Black Han Sans", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    --font-body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1426;
      --surface: #182038;
      --fg: #e9edfa;
      --muted: #9aa5c4;
      --line: #2a3354;
      --accent: #7c93ff;
      --accent-ink: #0f1426;
      --fe: #ff7b94;
      --be: #6fa0ff;
      --fs: #ffc53d;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1426;
    --surface: #182038;
    --fg: #e9edfa;
    --muted: #9aa5c4;
    --line: #2a3354;
    --accent: #7c93ff;
    --accent-ink: #0f1426;
    --fe: #ff7b94;
    --be: #6fa0ff;
    --fs: #ffc53d;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.65;
    padding-block: 28px 56px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  h1, h2, h3, p, ul { margin: 0; }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

  .hl {
    background: linear-gradient(transparent 58%, color-mix(in srgb, var(--result, var(--accent)) 42%, transparent) 58%);
    padding: 0 2px;
  }

  /* 이미지 자리 */
  .slot, .imgbox img {
    width: 100%;
    aspect-ratio: 4 / 3;
    border-radius: 20px;
    display: block;
    object-fit: cover;
  }
  .slot {
    border: 2px dashed var(--line);
    background: color-mix(in srgb, var(--result, var(--accent)) 8%, var(--surface));
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    color: var(--muted);
    text-align: center;
    padding: 16px;
  }
  .slot b { font-size: 15px; color: var(--fg); }
  .slot small { font-size: 13px; }

  /* 소개 */
  .eyebrow {
    display: inline-block;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--accent);
    border: 1.5px solid currentColor;
    border-radius: 999px;
    padding: 2px 12px;
  }
  .intro-title {
    font-family: var(--font-display);
    font-size: clamp(36px, 10vw, 52px);
    line-height: 1.2;
    font-weight: 400;
    margin-top: 16px;
    text-wrap: balance;
  }
  .lead { color: var(--muted); margin-top: 14px; }
  .intro .imgbox { margin-top: 24px; }
  .types { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; list-style: none; padding: 0; }
  .types li {
    display: flex; align-items: center; gap: 8px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 4px 14px 4px 10px;
    font-size: 14px; font-weight: 500;
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c); flex: none; }
  .meta { color: var(--muted); font-size: 14px; margin-top: 16px; }

  .btn {
    display: block;
    width: 100%;
    border: 0;
    border-radius: 14px;
    padding: 16px 24px;
    font-weight: 700;
    font-size: 17px;
    background: var(--accent);
    color: var(--accent-ink);
    margin-top: 20px;
    transition: transform .12s ease;
  }
  .btn:hover { transform: translateY(-1px); }
  .btn.ghost {
    background: transparent;
    color: var(--fg);
    border: 1.5px solid var(--line);
    margin-top: 10px;
  }

  /* 질문 */
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .back {
    background: none; border: 0; padding: 6px 8px 6px 0;
    color: var(--muted); font-size: 14px; font-weight: 500;
  }
  .count { font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .count span { color: var(--muted); font-weight: 500; }
  .segs { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; margin-top: 10px; }
  .segs i { height: 6px; border-radius: 3px; background: var(--line); }
  .segs i.done { background: var(--accent); }
  .segs i.now { background: color-mix(in srgb, var(--accent) 45%, var(--line)); }
  .qlabel { margin-top: 32px; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.06em; }
  .question {
    font-size: clamp(21px, 5.6vw, 27px);
    line-height: 1.4;
    font-weight: 700;
    margin-top: 6px;
    text-wrap: balance;
    word-break: keep-all;
  }
  .opts { list-style: none; padding: 0; margin-top: 24px; display: grid; gap: 10px; }
  .opt {
    width: 100%;
    display: grid;
    grid-template-columns: 30px minmax(0, 1fr);
    gap: 12px;
    align-items: start;
    text-align: left;
    background: var(--surface);
    border: 1.5px solid var(--line);
    border-radius: 14px;
    padding: 15px 16px;
    line-height: 1.5;
    word-break: keep-all;
    transition: border-color .12s ease, background-color .12s ease;
  }
  .opt .mk {
    width: 26px; height: 26px; border-radius: 8px;
    background: color-mix(in srgb, var(--accent) 14%, var(--surface));
    color: var(--accent);
    font-weight: 700; font-size: 13px;
    display: grid; place-items: center;
  }
  .opt:hover { border-color: var(--accent); }
  .opt.sel { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--surface)); }
  .opt.sel .mk { background: var(--accent); color: var(--accent-ink); }

  /* 결과 */
  .badge {
    display: inline-flex; align-items: center; gap: 8px;
    margin-top: 20px;
    font-size: 13px; font-weight: 700; letter-spacing: 0.08em;
  }
  .badge .dot { background: var(--result); }
  .r-title {
    font-family: var(--font-display);
    font-weight: 400;
    font-size: clamp(32px, 9vw, 44px);
    line-height: 1.25;
    margin-top: 6px;
    text-wrap: balance;
  }
  .r-tag { color: var(--muted); margin-top: 10px; word-break: keep-all; }
  .section { margin-top: 36px; padding-top: 22px; border-top: 1px solid var(--line); }
  .section h3 { font-size: 18px; font-weight: 700; }
  .section p { margin-top: 10px; word-break: keep-all; }
  .bars { display: grid; gap: 10px; margin-top: 18px; }
  .bar { display: grid; grid-template-columns: 92px minmax(0, 1fr) 40px; align-items: center; gap: 10px; font-size: 14px; }
  .bar .track { height: 10px; border-radius: 5px; background: var(--line); overflow: hidden; }
  .bar .fill { height: 100%; border-radius: 5px; background: var(--c); }
  .bar .n { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; }
  .traits { list-style: none; padding: 0; margin-top: 14px; display: grid; gap: 10px; }
  .traits li { display: grid; grid-template-columns: 14px minmax(0, 1fr); gap: 10px; word-break: keep-all; }
  .traits li::before { content: ""; width: 8px; height: 8px; margin-top: 10px; border-radius: 2px; background: var(--result); }
  .matches { list-style: none; padding: 0; margin-top: 14px; display: grid; gap: 10px; }
  .matches li {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px 16px;
    word-break: keep-all;
  }
  .matches b { display: block; font-size: 16px; }
  .matches span { color: var(--muted); font-size: 15px; }
  .copybox { display: block; width: 100%; margin-top: 10px; padding: 12px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); color: var(--fg); font: inherit; font-size: 14px; resize: none; }
  .note { min-height: 22px; margin-top: 10px; font-size: 14px; color: var(--muted); }

  .view { animation: rise .28s ease both; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    .view { animation: none; }
    .btn, .opt { transition: none; }
  }
</style>

<main class="wrap">
  <section id="intro" class="view intro"></section>
  <section id="quiz" class="view" hidden></section>
  <section id="result" class="view" hidden></section>
</main>

<script>
  // 결과 이미지 경로나 데이터 주소를 여기에 넣으면 이미지 자리가 이미지로 바뀝니다.
  var IMAGES = { intro: "./images/intro.png", frontend: "./images/fe.png", backend: "./images/be.png", fullstack: "./images/fs.png" };

  var LABEL = { frontend: "프론트엔드", backend: "백엔드", fullstack: "풀스택" };
  var COLOR = { frontend: "var(--fe)", backend: "var(--be)", fullstack: "var(--fs)" };

  // t: 어떤 유형에 점수를 주는 선택지인지 (frontend / backend / fullstack)
  var QUESTIONS = [
    { q: "새로 이사 온 집에서 가장 먼저 손이 가는 일은?", opts: [
      { t: "backend", text: "전기, 수도, 인터넷부터 제대로 되는지 점검한다" },
      { t: "frontend", text: "커튼과 조명, 가구 배치로 분위기부터 만든다" },
      { t: "fullstack", text: "짐을 풀면서 필요한 건 그때그때 다 해결한다" } ] },
    { q: "친구들과 여행 계획을 세우게 됐다. 나는?", opts: [
      { t: "frontend", text: "사진 잘 나오는 장소와 분위기 좋은 숙소를 찾는다" },
      { t: "fullstack", text: "큰 틀도 짜고, 예약도 하고, 맛집도 직접 찾는다" },
      { t: "backend", text: "이동 경로와 예약, 예산표를 꼼꼼히 정리한다" } ] },
    { q: "단톡방에서 약속 시간이 계속 헷갈린다. 이럴 때 나는?", opts: [
      { t: "fullstack", text: "일정표도 만들고 알림도 걸고 공지까지 직접 한다" },
      { t: "backend", text: "공유 캘린더를 만들고 알림 규칙부터 정한다" },
      { t: "frontend", text: "한눈에 보이는 일정표 이미지를 예쁘게 만들어 올린다" } ] },
    { q: "요리를 할 때 가장 신경 쓰는 부분은?", opts: [
      { t: "backend", text: "레시피의 정량과 순서를 정확하게 지키는 것" },
      { t: "fullstack", text: "냉장고 재료로 맛과 모양을 즉흥으로 맞추는 것" },
      { t: "frontend", text: "접시 위에 올렸을 때의 색 조합과 모양" } ] },
    { q: "카페에서 주문한 음료가 다르게 나왔다. 나는?", opts: [
      { t: "frontend", text: "직원분이 민망하지 않도록 부드럽게 말을 꺼낸다" },
      { t: "backend", text: "주문 내역을 확인하고 어디서 어긋났는지 짚어 본다" },
      { t: "fullstack", text: "상황을 보며 말투와 해결 방법을 함께 조율한다" } ] },
    { q: "방 정리를 시작했다. 어떤 순서로 하게 될까?", opts: [
      { t: "backend", text: "서랍 속 분류 기준부터 새로 만든다" },
      { t: "fullstack", text: "보이는 곳과 서랍 속을 번갈아 가며 정리한다" },
      { t: "frontend", text: "눈에 보이는 곳부터 깔끔하게 정리한다" } ] },
    { q: "친구 생일 선물을 고르는 기준은?", opts: [
      { t: "fullstack", text: "상대가 좋아할 걸 고르고 포장과 카드까지 직접 한다" },
      { t: "frontend", text: "포장과 첫인상이 근사한 선물" },
      { t: "backend", text: "오래 쓸 수 있고 실용적인 선물" } ] },
    { q: "낯선 동네에서 길을 찾을 때 나는?", opts: [
      { t: "frontend", text: "간판과 풍경을 보며 감으로 걷는다" },
      { t: "fullstack", text: "지도 앱을 보다가 눈앞의 풍경도 같이 살핀다" },
      { t: "backend", text: "지도 앱으로 가장 빠른 경로를 먼저 확인한다" } ] },
    { q: "내가 한 일에서 가장 뿌듯한 순간은?", opts: [
      { t: "backend", text: "아무 문제 없이 오래 잘 굴러갈 때" },
      { t: "frontend", text: "사람들이 “예쁘다”, “편하다”라고 말해 줄 때" },
      { t: "fullstack", text: "처음부터 끝까지 내 손으로 완성했을 때" } ] },
    { q: "갑자기 하루가 통째로 비었다. 나는?", opts: [
      { t: "fullstack", text: "미뤄 둔 작은 프로젝트를 하나 시작해 본다" },
      { t: "backend", text: "밀린 정리와 계획을 차분히 끝낸다" },
      { t: "frontend", text: "전시나 쇼핑, 사진 찍으러 밖으로 나간다" } ] }
  ];

  var TYPES = {
    frontend: {
      name: "프론트엔드 개발자",
      tag: "사람이 가장 먼저 만나는 화면을 책임지는 분위기 메이커",
      reason: function (n) {
        return "10문항 중 " + n + "문항에서 일의 결과가 다른 사람에게 어떻게 보이고 느껴질지를 먼저 떠올렸어요. 결과물의 첫인상과 상대의 반응을 중요하게 생각하는 선택이 가장 많아서, 화면과 사용 경험을 다루는 프론트엔드 성향이 가장 높게 나왔어요.";
      },
      traits: [
        "처음 보는 사람이 어떻게 느낄지 상상하는 공감 능력이 좋아요.",
        "색, 간격, 말투 같은 작은 차이를 알아채는 눈이 있어요.",
        "결과물에 좋은 반응이 돌아올 때 가장 큰 보람을 느껴요.",
        "겉모습에 시간을 쓰다 보면 속 구조를 놓칠 수 있으니 점검하는 습관이 있으면 좋아요."
      ],
      match: [
        { who: "백엔드 개발자형", why: "보이지 않는 곳을 단단히 받쳐 줘서 화면에 집중할 수 있어요." },
        { who: "꼼꼼한 기획자", why: "만들고 싶은 모습을 말로 정리해 주면 아이디어가 더 빨리 형태가 돼요." },
        { who: "감각 있는 디자이너", why: "서로의 눈높이가 비슷해서 이야기가 잘 통해요." }
      ]
    },
    backend: {
      name: "백엔드 개발자",
      tag: "보이지 않는 곳에서 모든 것이 굴러가게 만드는 설계자",
      reason: function (n) {
        return "10문항 중 " + n + "문항에서 겉모습보다 구조와 원칙을 먼저 챙겼어요. 순서를 정하고, 원인을 찾고, 오래 탈 없이 돌아가게 만드는 선택이 가장 많아서, 서버와 데이터를 다루는 백엔드 성향이 가장 높게 나왔어요.";

      traits: [
        "문제가 생기면 원인을 차근차근 거슬러 올라가 찾아내요.",
        "규칙과 순서를 정해 두면 마음이 편해지는 타입이에요.",
        "티가 나지 않아도 오래 탈 없이 돌아갈 때 뿌듯함을 느껴요.",
        "설명이 적으면 노력이 잘 안 보일 수 있으니 진행 상황을 가끔 말로 공유하면 좋아요."

      match: [
        { who: "프론트엔드 개발자형", why: "내가 만든 구조를 사람들이 쓰기 좋은 모습으로 보여 줘요." },

      ],
      match: [
        { who: "프론트엔드·백엔드 개발자형", why: "각자 깊이 있는 부분을 맡고, 나는 둘 사이를 이어 줄 수 있어요." },
        { who: "목표가 분명한 기획자", why: "방향만 정해지면 빠르게 만들어 보여 줄 수 있어요." },
        { who: "일정을 챙겨 주는 팀원", why: "많은 일을 벌이는 나에게 마감과 우선순위를 잡아 줘요." }
      ]
    }
  };

  var $ = function (s) { return document.querySelector(s); };
  var views = { intro: $("#intro"), quiz: $("#quiz"), result: $("#result") };
  var idx = 0;
  var answers = [];
  var locked = false;

  function show(name) {
    for (var k in views) { views[k].hidden = (k !== name); }
    window.scrollTo(0, 0);
  }

  function imgSlot(key, label, hint) {
    if (IMAGES[key]) {
      return '<div class="imgbox"><img src="' + IMAGES[key] + '" alt="' + label + '"></div>';
    }
    return '<div class="imgbox"><div class="slot"><b>' + label + '</b><small>' + hint + '</small></div></div>';
  }

  function renderIntro() {
    views.intro.innerHTML =
      '<span class="eyebrow">일상 속 10가지 상황</span>' +
      '<h1 class="intro-title">나는 어떤<br><span class="hl">개발자</span> 유형일까?</h1>' +
      '<p class="lead">길 찾기, 요리, 방 정리 같은 평범한 하루의 선택으로 알아보는 나의 개발자 성향. 정답은 없으니 먼저 떠오르는 대로 골라 주세요.</p>' +
      imgSlot("intro", "소개 이미지", "intro 이미지를 넣을 자리") +
      '<ul class="types" aria-label="나올 수 있는 결과">' +
        '<li style="--c:var(--fe)"><i class="dot"></i>프론트엔드</li>' +
        '<li style="--c:var(--be)"><i class="dot"></i>백엔드</li>' +
        '<li style="--c:var(--fs)"><i class="dot"></i>풀스택</li>' +
      '</ul>' +
      '<p class="meta">10문항 · 약 2분 · 결과는 3가지</p>' +
      '<button class="btn" id="start" type="button">테스트 시작하기</button>';
    $("#start").addEventListener("click", function () {
      idx = 0; answers = []; renderQuestion(); show("quiz");
    });
  }

  function renderQuestion() {
    var d = QUESTIONS[idx];
    var segs = "";
    for (var k = 0; k < QUESTIONS.length; k++) {
      segs += '<i class="' + (k < idx ? "done" : k === idx ? "now" : "") + '"></i>';
    }
    var letters = ["A", "B", "C"];
    var opts = "";
    for (var j = 0; j < d.opts.length; j++) {
      var sel = answers[idx] === d.opts[j].t ? " sel" : "";
      opts += '<li><button class="opt' + sel + '" type="button" data-t="' + d.opts[j].t + '">' +
        '<span class="mk">' + letters[j] + '</span><span>' + d.opts[j].text + '</span></button></li>';
    }
    views.quiz.innerHTML =
      '<div class="topbar"><button class="back" id="back" type="button">← 이전</button>' +
      '<div class="count">' + (idx + 1) + ' <span>/ ' + QUESTIONS.length + '</span></div></div>' +
      '<div class="segs" aria-hidden="true">' + segs + '</div>' +
      '<p class="qlabel">Q' + (idx + 1) + '</p>' +
      '<h2 class="question">' + d.q + '</h2>' +
      '<ul class="opts">' + opts + '</ul>';

    $("#back").addEventListener("click", function () {
      if (locked) return;
      if (idx === 0) { show("intro"); return; }
      idx--; renderQuestion();
    });
    var btns = views.quiz.querySelectorAll(".opt");
    for (var b = 0; b < btns.length; b++) {
      btns[b].addEventListener("click", function (e) {
        if (locked) return;
        locked = true;
        var t = e.currentTarget.getAttribute("data-t");
        answers[idx] = t;
        var all = views.quiz.querySelectorAll(".opt");
        for (var m = 0; m < all.length; m++) { all[m].classList.remove("sel"); }
        e.currentTarget.classList.add("sel");
        setTimeout(function () {
          locked = false;
          if (idx < QUESTIONS.length - 1) { idx++; renderQuestion(); }
          else { renderResult(); show("result"); }
        }, 240);
      });
    }
  }

  function tally() {
    var c = { frontend: 0, backend: 0, fullstack: 0 };
    for (var i = 0; i < answers.length; i++) { c[answers[i]]++; }
    var max = Math.max(c.frontend, c.backend, c.fullstack);
    var top = [];
    for (var k in c) { if (c[k] === max) top.push(k); }
    return { counts: c, key: top.length === 1 ? top[0] : "fullstack" };
  }

  function renderResult() {
    var r = tally();
    var T = TYPES[r.key];
    var c = r.counts;
    var bars = "";
    var order = ["frontend", "backend", "fullstack"];
    for (var i = 0; i < order.length; i++) {
      var k = order[i];
      bars += '<div class="bar" style="--c:' + COLOR[k] + '"><span>' + LABEL[k] + '</span>' +
        '<div class="track"><div class="fill" style="width:' + (c[k] / QUESTIONS.length * 100) + '%"></div></div>' +
        '<span class="n">' + c[k] + '</span></div>';
    }
    var traits = "";
    for (var a = 0; a < T.traits.length; a++) { traits += "<li><span>" + T.traits[a] + "</span></li>"; }
    var match = "";
    for (var b = 0; b < T.match.length; b++) {
      match += "<li><b>" + T.match[b].who + "</b><span>" + T.match[b].why + "</span></li>";
    }
    var copyText = "나는 " + T.name + "형! — " + T.tag + " (개발자 성향 테스트)";

    views.result.style.setProperty("--result", COLOR[r.key]);
    views.result.innerHTML =
      imgSlot(r.key, T.name + " 결과 이미지", r.key + " 이미지를 넣을 자리") +
      '<div class="badge"><i class="dot"></i>나의 개발자 유형</div>' +
      '<h2 class="r-title"><span class="hl">' + T.name + '</span></h2>' +
      '<p class="r-tag">' + T.tag + '</p>' +
      '<div class="section"><h3>이 결과가 나온 이유</h3>' +
        '<p>' + T.reason(c[r.key], c) + '</p>' +
        '<div class="bars">' + bars + '</div></div>' +
      '<div class="section"><h3>성향 분석</h3><ul class="traits">' + traits + '</ul></div>' +
      '<div class="section"><h3>이런 사람과 잘 맞아요</h3><ul class="matches">' + match + '</ul></div>' +
      '<button class="btn" id="retry" type="button">다시 테스트하기</button>' +
      '<button class="btn ghost" id="copy" type="button">결과 문구 복사하기</button>' +
      '<p class="note" id="note" role="status"></p>';

    $("#retry").addEventListener("click", function () { idx = 0; answers = []; show("intro"); });
    $("#copy").addEventListener("click", function () {
      var note = $("#note");
      function fallback() {
        note.innerHTML = '복사가 막혀 있어요. 아래 문구를 직접 선택해서 복사해 주세요.' +
          '<textarea class="copybox" id="box" rows="2" readonly></textarea>';
        var box = $("#box"); box.value = copyText; box.focus(); box.select();
      }
      try {
        navigator.clipboard.writeText(copyText).then(function () {
          note.textContent = "복사했어요. 친구에게 공유해 보세요.";
        }, fallback);
      } catch (e) { fallback(); }
    });
  }

  renderIntro();
</script>

</body></html>
